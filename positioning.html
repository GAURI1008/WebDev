<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      position: relative;

      /* Replace with your image name */
        background-image: url('hehe.jpeg');
      background-size: cover;
      background-position: center;

      font-family: sans-serif;
      font-weight: bold;
    }

    /* Give every text absolute positioning */
    p {
      position: absolute;
      margin: 10px;
    }

    /* Corners */
    .top-left     { top: 0; left: 0; }
    .top-right    { top: 0; right: 0; }
    .bottom-left  { bottom: 0; left: 0; }
    .bottom-right { bottom: 0; right: 0; }

    /* Sides & Centers */
    .top-center    { top: 0; left: 45%; }
    .bottom-center { bottom: 0; left: 45%; }
    .mid-left      { top: 45%; left: 0; }
    .mid-right     { top: 45%; right: 0; }
    .center        { top: 45%; left: 45%; }
  </style>
</head>
<body>
    <img src="WhatsApp Image 2026-10-14 at 09.28.08.jpeg" alt="gauri">

  <!-- Top -->
  <p class="top-left">Gauri</p>
  <p class="top-center">Gaurii</p>
  <p class="top-right">Gauri</p>

  <!-- Middle -->
  <p class="mid-left">Gauri</p>
  <p class="center">Gauri</p>
  <p class="mid-right">Gauri</p>

  <!-- Bottom -->
  <p class="bottom-left">Gauri</p>
  <p class="bottom-center">Gauri</p>
  <p class="bottom-right">Gauri</p>



</body>
</html>
