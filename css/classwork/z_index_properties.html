<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
  }

  body {
    position: relative;     
    min-height: 100vh;      
  }
  img {
    position: absolute;     
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;          
    object-fit: cover;
    z-index: -1;
  }

  h1, p {
    color: white;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
  }
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="31 Sfondi Van Gogh 4K - Arte famosa con Van Gogh.jpeg" alt="Van Gogh painting">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
