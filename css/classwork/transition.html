

 
<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: aqua;
  animation-name: myAnimation;
  animation-duration: 4s;
}
@keyframes myAnimation{
  from{background-color: aqua;}
  to{background-color: brown;}
}
  
  



div:hover {
 
  transform: rotate(137.5deg);
  border-radius:50%;
  translate: 80px;
}
</style>
</head>
<body>


<div></div>

</body>
</html>
