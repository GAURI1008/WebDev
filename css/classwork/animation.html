<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: aqua;
  animation-name: myAnimation;
  animation-duration: 4s;
}

@keyframes myAnimation {
  from {background-color: aqua;}
  to {background-color: yellow;}
}
</style>
</head>
<body>

<h1>CSS Animation</h1>

<div></div>



</body>
</html>
