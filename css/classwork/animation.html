<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: aqua;
  animation-name: myAnimation;
  animation-duration: 4s;
  position:relative;
  animation-delay:2s;
  animation-iteration-count: 5;
  animation-direction:reverse;
}

@keyframes myAnimation {
  0% {background-color: aqua; left:0px;top:0px;}
  40% {background-color: rgb(8, 0, 255); left:200px;top:0px;}
  60% {background-color: rgb(0, 255, 8); left:0px;top:200px;}
  80% {background-color: rgb(255, 238, 0); left:0px;top:200px;}
  100% {background-color: #a80077; left:0px;top:0px;}
  
}
</style>
</head>
<body>

<h1>CSS Animation</h1>

<div></div>



</body>
</html>
