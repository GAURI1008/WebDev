<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  
  animation-name: myAnimation;
  animation-duration: 4s;
  position:relative;
  animation-delay:2s;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-direction:reverse;
}

@keyframes myAnimation {
  0% {background-color: aqua;border-radius: 0%; left:0px;top:0px;}
  25% {background-color: rgb(8, 0, 255); border-radius: 50% ;left:200px;top:0px;}
  50% {background-color: rgb(0, 255, 8); border-radius: 50%; left:0px;top:200px;}
  75% {background-color: rgb(255, 238, 0); border-radius: 50%;  left:0px;top:200px;}
  100% {background-color: #a80077; border-radius: 0%; left:0px;top:0px;}
  
}
</style>
</head>
<body>

<h1>CSS Animation</h1>

<div></div>



</body>
</html>
