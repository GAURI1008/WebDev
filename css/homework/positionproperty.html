<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauri</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;        
      background: #111;
    }

   
    .image-box {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;          
    }

    .image-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;      
    }
    .image-box p {
      position: absolute;
      margin: 0;
      padding: 10px;
      color: white;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 24px;
      text-shadow: 0 0 4px black, 0 0 8px black;
    }

    
    .top-left     { top: 0;    left: 0; }
    .top-right    { top: 0;    right: 0; }
    .bottom-left  { bottom: 0; left: 0; }
    .bottom-right { bottom: 0; right: 0; }

    
    .top-center    { top: 0;    left: 50%; transform: translateX(-50%); }
    .bottom-center { bottom: 0; left: 50%; transform: translateX(-50%); }

   
    .mid-left  { top: 50%; left: 0;  transform: translateY(-50%); }
    .mid-right { top: 50%; right: 0; transform: translateY(-50%); }
    .center    { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  </style>
</head>
<body>

  <div class="image-box">
    <img src="j.jpeg" alt="Gauri">

    
    <p class="top-left">Gauri</p>
    <p class="top-center">Gauri</p>
    <p class="top-right">Gauri</p>

    
    <p class="mid-left">Gauri</p>
    <p class="center">Gauri</p>
    <p class="mid-right">Gauri</p>

    
    <p class="bottom-left">Gauri</p>
    <p class="bottom-center">Gauri</p>
    <p class="bottom-right">Gauri</p>
  </div>

</body>
</html>
